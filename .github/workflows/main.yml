name: 24/7 Minecraft AFK Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # Har 30 minute mein automatic restart taaki bot off na ho

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Start AFK Bot
        run: node bot.js
        timeout-minutes: 350
